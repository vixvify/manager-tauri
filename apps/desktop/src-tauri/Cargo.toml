[package]
name = "devdeck"
version = "0.1.0"
description = "DevDeck local development project manager"
authors = ["DevDeck"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "devdeck_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
